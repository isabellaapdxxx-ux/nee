<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habit Streaks</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #191c23;
    --card-hover: #20242d;
    --text: #f2f3f5;
    --muted: #8a909c;
    --accent: #ff7a3d;
    --accent-2: #ffb547;
    --done: #3ddc84;
    --border: #2a2f3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 28px 16px 60px; }
  header h1 { margin: 0; font-size: 28px; letter-spacing: -0.5px; }
  header p { margin: 4px 0 22px; color: var(--muted); font-size: 14px; }

  form { display: flex; gap: 8px; margin-bottom: 20px; }
  form input {
    flex: 1; min-width: 0;
    background: var(--card); color: var(--text);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; font-size: 16px; outline: none;
  }
  form input:focus { border-color: var(--accent); }
  form button {
    background: var(--accent); color: #fff; border: 0; border-radius: 12px;
    padding: 0 18px; font-size: 16px; font-weight: 600; cursor: pointer;
  }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; text-align: center; }
  .stat b { display: block; font-size: 22px; }
  .stat span { font-size: 12px; color: var(--muted); }

  .habit {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 14px; margin-bottom: 10px; cursor: pointer;
    transition: background .15s, transform .1s;
    user-select: none;
  }
  .habit:hover { background: var(--card-hover); }
  .habit:active { transform: scale(0.985); }
  .habit .info { flex: 1; min-width: 0; }
  .habit .name { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .week { display: flex; gap: 4px; margin-top: 8px; }
  .week i {
    width: 18px; height: 18px; border-radius: 5px; background: #262a33;
    font-style: normal; font-size: 9px; color: var(--muted);
    display: grid; place-items: center;
  }
  .week i.on { background: var(--done); color: #0b2a17; }
  .week i.today { outline: 1.5px solid var(--muted); outline-offset: 1px; }
  .flame { font-size: 14px; color: var(--accent-2); font-weight: 700; min-width: 40px; text-align: right; }
  .check {
    width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid var(--border); background: transparent; color: transparent;
    font-size: 20px; cursor: pointer; display: grid; place-items: center;
    transition: all .15s;
  }
  .check.done { background: var(--done); border-color: var(--done); color: #0b2a17; }
  .del {
    background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer;
    padding: 4px; opacity: .5;
  }
  .del:hover { opacity: 1; color: #ff5b5b; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }

  /* Streak popup */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: grid; place-items: center; padding: 16px;
    opacity: 0; pointer-events: none; transition: opacity .25s;
    backdrop-filter: blur(4px);
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .popup {
    width: 100%; max-width: 340px; text-align: center;
    background: linear-gradient(160deg, #2a1c14, #191c23 60%);
    border: 1px solid #3a2a20; border-radius: 24px; padding: 28px 22px 22px;
    transform: scale(.85); transition: transform .25s cubic-bezier(.2,1.4,.4,1);
    overflow: hidden; position: relative;
  }
  .overlay.show .popup { transform: scale(1); }
  .popup .big-flame { font-size: 64px; line-height: 1; animation: bob 1.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-6px) scale(1.05); } }
  .popup h2 { margin: 10px 0 2px; font-size: 18px; color: var(--muted); font-weight: 500; }
  .popup .count { font-size: 64px; font-weight: 800; color: var(--accent-2); line-height: 1.1; }
  .popup .unit { color: var(--muted); font-size: 15px; }
  .popup .msg { margin: 14px 0 4px; font-size: 15px; }
  .popup .best { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .popup .timer {
    position: absolute; left: 0; bottom: 0; height: 4px; width: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transform-origin: left;
  }
  .popup .timer.run { animation: shrink 5s linear forwards; }
  @keyframes shrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔥 Habit Streaks</h1>
    <p id="today"></p>
  </header>

  <form id="addForm">
    <input id="habitInput" placeholder="New habit, e.g. Drink water" maxlength="40" autocomplete="off">
    <button type="submit">Add</button>
  </form>

  <div class="stats">
    <div class="stat"><b id="sDone">0/0</b><span>done today</span></div>
    <div class="stat"><b id="sBest">0</b><span>top streak</span></div>
    <div class="stat"><b id="sTotal">0</b><span>total check-ins</span></div>
  </div>

  <div id="list"></div>
</div>

<div class="overlay" id="overlay">
  <div class="popup">
    <div class="big-flame" id="pIcon">🔥</div>
    <h2 id="pName"></h2>
    <div class="count" id="pCount">0</div>
    <div class="unit" id="pUnit">day streak</div>
    <div class="msg" id="pMsg"></div>
    <div class="best" id="pBest"></div>
    <div class="timer" id="pTimer"></div>
  </div>
</div>

<script>
const KEY = 'habit-streaks-v1';
let habits = load();

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(habits)); } catch {}
}

// Local-date helpers (YYYY-MM-DD in the user's timezone)
function dateKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function daysAgo(n) { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - n); return d; }
const todayKey = () => dateKey(new Date());

// Current streak: counts back from today (or from yesterday if today isn't done yet,
// so your streak doesn't look "broken" before you've had a chance to do it).
function currentStreak(h) {
  const set = new Set(h.days);
  let start = set.has(dateKey(daysAgo(0))) ? 0 : 1;
  let n = 0;
  while (set.has(dateKey(daysAgo(start + n)))) n++;
  return n;
}
function bestStreak(h) {
  const sorted = [...h.days].sort();
  let best = 0, run = 0, prev = null;
  for (const k of sorted) {
    const d = new Date(k + 'T12:00:00');
    run = prev && Math.round((d - prev) / 86400000) === 1 ? run + 1 : 1;
    best = Math.max(best, run);
    prev = d;
  }
  return best;
}

function addHabit(name) {
  habits.push({ id: Date.now().toString(36), name, days: [], created: todayKey() });
  save(); render();
}
function toggleToday(id) {
  const h = habits.find(x => x.id === id);
  const t = todayKey();
  h.days = h.days.includes(t) ? h.days.filter(d => d !== t) : [...h.days, t];
  save(); render();
}
function removeHabit(id) {
  const h = habits.find(x => x.id === id);
  if (!confirm(`Delete "${h.name}"? Its streak will be lost.`)) return;
  habits = habits.filter(x => x.id !== id);
  save(); render();
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function render() {
  document.getElementById('today').textContent =
    new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });

  const list = document.getElementById('list');
  const t = todayKey();

  if (!habits.length) {
    list.innerHTML = '<div class="empty">No habits yet — add one above 👆</div>';
  } else {
    list.innerHTML = habits.map(h => {
      const done = h.days.includes(t);
      const streak = currentStreak(h);
      const set = new Set(h.days);
      const week = [6, 5, 4, 3, 2, 1, 0].map(n => {
        const d = daysAgo(n);
        const on = set.has(dateKey(d));
        const letter = d.toLocaleDateString(undefined, { weekday: 'narrow' });
        return `<i class="${on ? 'on' : ''} ${n === 0 ? 'today' : ''}">${letter}</i>`;
      }).join('');
      return `
        <div class="habit" data-id="${h.id}">
          <button class="check ${done ? 'done' : ''}" data-act="check" aria-label="Mark done today">✓</button>
          <div class="info">
            <div class="name">${escapeHtml(h.name)}</div>
            <div class="week">${week}</div>
          </div>
          <div class="flame">${streak ? '🔥 ' + streak : ''}</div>
          <button class="del" data-act="del" aria-label="Delete habit">✕</button>
        </div>`;
    }).join('');
  }

  const doneToday = habits.filter(h => h.days.includes(t)).length;
  document.getElementById('sDone').textContent = `${doneToday}/${habits.length}`;
  document.getElementById('sBest').textContent = Math.max(0, ...habits.map(currentStreak));
  document.getElementById('sTotal').textContent = habits.reduce((a, h) => a + h.days.length, 0);
}

// ---- Streak popup (auto-hides after 5 seconds) ----
let hideTimer = null;
function showStreak(h) {
  const streak = currentStreak(h);
  const best = bestStreak(h);
  const doneToday = h.days.includes(todayKey());

  document.getElementById('pName').textContent = h.name;
  document.getElementById('pCount').textContent = streak;
  document.getElementById('pUnit').textContent = 'day streak';
  document.getElementById('pIcon').textContent = streak === 0 ? '🌱' : streak >= 30 ? '🏆' : streak >= 7 ? '⚡' : '🔥';

  let msg;
  if (streak === 0) msg = doneToday ? 'Nice start!' : 'Check it off today to start a streak!';
  else if (!doneToday) msg = "Don't break the chain — do it today!";
  else if (streak >= 30) msg = 'Legendary consistency 👑';
  else if (streak >= 7) msg = "You're on fire! Keep going 💪";
  else msg = 'Keep it up!';
  document.getElementById('pMsg').textContent = msg;
  document.getElementById('pBest').textContent = `Best streak: ${best} day${best === 1 ? '' : 's'} · ${h.days.length} total`;

  // restart progress bar animation
  const bar = document.getElementById('pTimer');
  bar.classList.remove('run'); void bar.offsetWidth; bar.classList.add('run');

  document.getElementById('overlay').classList.add('show');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(hideStreak, 5000);
}
function hideStreak() {
  clearTimeout(hideTimer);
  document.getElementById('overlay').classList.remove('show');
}

// ---- Events ----
document.getElementById('addForm').addEventListener('submit', e => {
  e.preventDefault();
  const input = document.getElementById('habitInput');
  const name = input.value.trim();
  if (name) { addHabit(name); input.value = ''; }
});

document.getElementById('list').addEventListener('click', e => {
  const card = e.target.closest('.habit');
  if (!card) return;
  const id = card.dataset.id;
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'check') return toggleToday(id);
  if (act === 'del') return removeHabit(id);
  showStreak(habits.find(h => h.id === id));
});

document.getElementById('overlay').addEventListener('click', hideStreak);

// Re-render at midnight so "today" rolls over
setInterval(() => { if (document.getElementById('today').dataset.k !== todayKey()) { document.getElementById('today').dataset.k = todayKey(); render(); } }, 60000);
document.getElementById('today').dataset.k = todayKey();

render();
</script>
</body>
</html>
